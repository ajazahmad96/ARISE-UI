<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080A0F">
  <title>ARISE UI Studio</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/arise-app-icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <aside class="studio-side" aria-label="UI Studio">
      <div class="brand"><img src="assets/logo/arise-logo.svg" alt="ARISE"><div><b>ARISE</b><span>UI Design Studio</span></div></div>
      <p>An independent visual prototype of the ARISE Android app. Nothing here touches the real app, its data or its build.</p>
      <h4>JUMP TO</h4>
      <button data-act="nav:library">Screen Library</button>
      <button data-act="nav:dashboard">Dashboard</button>
      <button data-act="nav:profile">Profile</button>
      <p style="margin-top:16px">Press <kbd>Esc</kbd> to close a sheet or dialog.</p>
    </aside>

    <main class="phone" id="phone" aria-label="ARISE phone preview">
      <div class="app" id="app"></div>
      <div class="overlay-layer" id="overlays"></div>
      <div class="toast-stack" id="toasts"></div>
      <div id="pill"></div>
    </main>
  </div>

  <script src="assets/icons/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
